name: Dependency submission

# Resolves the Gradle dependency graph and submits it to GitHub, which is
# what makes Dependabot alerts and dependency-review.yml see Gradle
# dependencies at all: GitHub cannot read a Gradle build on its own.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the submission API

jobs:
  submit:
    name: Submit the Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only what a consumer of the library gets; the Kotlin Gradle
          # plugin and the rest of the build classpath are not part of it.
          dependency-graph-include-configurations: 'runtimeClasspath'

