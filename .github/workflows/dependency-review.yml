name: Dependency review

# Fails a PR that adds a dependency with a known high-severity advisory or
# an unacceptable licence. Compares the dependency graph of the PR against
# the base branch; on the Gradle repos that graph comes from
# dependency-submission.yml, on the Swift ones from Package.resolved.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # posts the summary as a PR comment

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
