name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and publish dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Caches ~/.gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests
        run: ./gradlew :liftcore:test --rerun

      # The exact command jitpack.yml runs on a tag, so a tag never discovers
      # a publishing problem CI could have caught.
      - name: Publish to Maven local (dry run)
        run: ./gradlew :liftcore:publishToMavenLocal -PKIT_VERSION=ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: liftcore/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
